<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LumeraFoundry | Unified Security Intelligence & Risk Quantification</title>
  <meta name="description"
    content="LumeraFoundry Security India Pvt Ltd - Empowering global enterprises through proactive risk intelligence, unified security controls, and advanced ROSI analytics." />
  <link rel="icon" type="image/png" href="/assets/logo_light.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@100;400;700;900&family=Barlow:wght@100;400;700&family=DM+Serif+Display&family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulseGlow {
      0% {
        box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.4);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(0, 229, 255, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(0, 229, 255, 0);
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
